<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Claw Machine</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,500;0,700;1,600&display=swap"
        rel="stylesheet">
    <!-- <link rel="stylesheet" href="style.css"> -->
</head>

<body>
    <h1>Claw Machine</h1>
    <div class="machine">
        <canvas id="game" width="160" height="220"></canvas>
    </div>
    <p class="score">Bichinhos pegos: <b id="score">0</b></p>
    <button id="btn" class="push" type="button"
        aria-label="Segure para mover a garra, solte para parar">&#9654;</button>
    <p class="hint">Segure o botão para mover a garra.<br>Solte para parar e a garra descer.<br>No teclado: segure
        Espaço.</p>
    <script src="script.js"></script>
</body>

</html>
